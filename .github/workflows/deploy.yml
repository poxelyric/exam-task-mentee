name: Deploy to AWS

permissions:
  id-token: write
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
    # paths:
    #   - 'app/**'
    #   - 'terraform/**'
jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: set up terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.17.2"

      - run: cd terraform
      
      - run: terraform init

      - run: terraform apply -auto-approve -input=false -var="aws_region=${{ vars.REGION }}" -var="container_port=8080"