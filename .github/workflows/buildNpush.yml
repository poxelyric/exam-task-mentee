name: build and push

permissions:
  id-token: write
  contents: write
  actions: write

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'Dockerfile'

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # - name: oidc-debugger-action
      #   # You may pin to the exact commit or the version.
      #   # uses: steve-todorov/oidc-debugger-action@b6d83b24a379e77233fb6b26f1c1a662c4bf443c
      #   uses: steve-todorov/oidc-debugger-action@v1.0.2
      #   with:
      #     # The audience to use when requesting the JWT. Your Github server URL and repository owner (e.g. https://github.com/github).
      #     audience: sts.amazonaws.com # default is ${{ github.server_url }}/${{ github.repository }}
          
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ secrets.ROLE_ARN }}
          aws-region: ${{ vars.REGION }}
      

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@62f4f872db3836360b72999f4b87f1ff13310f3a

      # - name: Check changed files
      #   uses: dorny/paths-filter@v3
      #   id: filter
      #   with:
      #     filters: |
      #       docker:
      #         - 'dockerfile'
      #       app:
      #         - 'app/**'

      - name: bump minor version if only dockerfile changed
        id: bump-version
        uses: bitshifted/git-auto-semver@v2.0.11
        with:
          main_branch: improve
          create_tag: true
          initial_version: 0.0.0
      #     manual_bump: minor
      #   if: steps.filter.outputs.app == 'false'
      
      # - name: Bump version and push tag if app changed
      #   uses: bitshifted/git-auto-semver@v2.0.11
      #   with:
      #     create_tag: true
      #     initial_version: 0.0.0
      #     manual_bump: minor
      #   if: steps.filter.outputs.app == 'true'


      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.bump-version.outputs.version-string }}
          ECR_REPOSITORY: ${{ vars.REPOSITORY }}
        run: |
          # Build a docker container and
          # push it to ECR so that it can
          # be deployed to ECS.
          docker build --build-arg APP_VERSION=$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
